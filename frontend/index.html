<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TraChat" />
    <title>TraChat</title>
    <script>
      // Detailed error display for debugging on iOS
      (function() {
        // Global function call log
        var callLog = [];
        var maxLogSize = 50;

        function logCall(name, args) {
          callLog.push({
            time: new Date().toISOString(),
            name: name,
            args: args ? JSON.stringify(args).substring(0, 200) : ''
          });
          if (callLog.length > maxLogSize) {
            callLog.shift();
          }
        }

        // Patch console methods to capture logs
        var originalLog = console.log;
        var originalError = console.error;
        var originalWarn = console.warn;

        console.log = function() {
          logCall('console.log', Array.from(arguments).join(' '));
          originalLog.apply(console, arguments);
        };

        console.error = function() {
          logCall('console.error', Array.from(arguments).join(' '));
          originalError.apply(console, arguments);
        };

        console.warn = function() {
          logCall('console.warn', Array.from(arguments).join(' '));
          originalWarn.apply(console, arguments);
        };

        // Expose log for debugging
        window.__getCallLog = function() {
          return callLog;
        };

        function showError(title, details) {
          var root = document.getElementById('root');
          if (!root) return;

          // Get last 20 calls
          var recentCalls = callLog.slice(-20).map(function(entry) {
            return entry.time + ' | ' + entry.name + ' | ' + entry.args;
          }).join('\n');

          var errorHtml = '<div style="padding:16px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;color:#333;background:#fff;min-height:100vh;word-break:break-word;">' +
            '<h2 style="color:#d32f2f;margin:0 0 12px;font-size:18px;">' + title + '</h2>' +
            '<h3 style="color:#1976d2;margin:0 0 8px;font-size:14px;">Error Details:</h3>' +
            '<pre style="white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px;font-size:11px;max-height:30vh;overflow-y:auto;margin:0 0 16px;border-left:4px solid #d32f2f;">' + details + '</pre>' +
            '<h3 style="color:#1976d2;margin:0 0 8px;font-size:14px;">Recent Calls:</h3>' +
            '<pre style="white-space:pre-wrap;background:#e3f2fd;padding:12px;border-radius:8px;font-size:11px;max-height:30vh;overflow-y:auto;margin:0 0 16px;border-left:4px solid #1976d2;">' + recentCalls + '</pre>' +
            '<h3 style="color:#1976d2;margin:0 0 8px;font-size:14px;">System Info:</h3>' +
            '<pre style="white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:8px;font-size:11px;max-height:15vh;overflow-y:auto;margin:0 0 16px;">' +
            'User Agent: ' + navigator.userAgent + '\n' +
            'Location: ' + window.location.href + '\n' +
            'Screen: ' + window.innerWidth + 'x' + window.innerHeight + '\n' +
            'Timestamp: ' + new Date().toISOString() +
            '</pre>' +
            '<button onclick="location.reload()" style="padding:10px 20px;font-size:14px;background:#1976d2;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:8px;">Обновить страницу</button>' +
            '<button onclick="this.innerHTML=\'Скопировано!\';navigator.clipboard.writeText(document.querySelector(\'pre\').textContent)" style="padding:10px 20px;font-size:14px;background:#757575;color:#fff;border:none;border-radius:4px;cursor:pointer;">Скопировать ошибку</button>' +
            '</div>';

          root.innerHTML = errorHtml;
        }

        window.addEventListener('error', function(e) {
          var error = e.error || {};
          var details = 'Message: ' + (error.message || e.message || 'Unknown') + '\n\n' +
            'Stack: ' + (error.stack || 'No stack trace') + '\n\n' +
            'Filename: ' + (e.filename || 'Unknown') + '\n' +
            'Line: ' + (e.lineno || 'Unknown') + '\n' +
            'Column: ' + (e.colno || 'Unknown');
          showError('JavaScript Error', details);
        });

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason || {};
          var details = 'Message: ' + (reason.message || 'Unknown') + '\n\n' +
            'Stack: ' + (reason.stack || 'No stack trace') + '\n\n' +
            'Type: ' + (typeof reason);
          showError('Unhandled Promise Rejection', details);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
